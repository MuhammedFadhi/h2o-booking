<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="SA'DA H2O — Installer Portal">
  <defs>
    <linearGradient id="ringI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123A6E"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="dropI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.55" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="wrenchI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C36A"/>
      <stop offset="1" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>
  <g transform="translate(48 48)">
    <!-- Badge -->
    <circle r="42" fill="url(#ringI)" stroke="url(#wrenchI)" stroke-width="1.5"/>
    <circle r="35" fill="none" stroke="rgba(201,168,76,0.22)" stroke-width="0.6" stroke-dasharray="2 3"/>

    <!-- Droplet -->
    <path d="M 0 -22 C 13 -6 20 5 20 13 A 20 20 0 1 1 -20 13 C -20 5 -13 -6 0 -22 Z" fill="url(#dropI)"/>
    <path d="M -8 -2 C -12 4 -13 10 -10 15" stroke="rgba(255,255,255,0.6)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Spanner: crosses top-right, at 45°. Head is an open-jaw ring. -->
    <g transform="translate(18 -18) rotate(35)">
      <!-- Handle -->
      <rect x="0" y="-2.2" width="22" height="4.4" rx="1" fill="url(#wrenchI)"/>
      <!-- Ring head at the far right -->
      <circle cx="26" cy="0" r="6.5" fill="url(#wrenchI)"/>
      <circle cx="26" cy="0" r="3.2" fill="#0A1628"/>
      <!-- Open-jaw head at the near left -->
      <path d="M 0 -4 L 0 4 L -3 4 L -3 2 A 3 3 0 0 1 -3 -2 L -3 -4 Z" fill="url(#wrenchI)"/>
    </g>

    <!-- Corner accents -->
    <g fill="url(#wrenchI)">
      <circle cx="-24" cy="24" r="1.6"/>
      <circle cx="-24" cy="-24" r="1.6"/>
    </g>
  </g>
  <g transform="translate(112 40)" font-family="'Playfair Display', Georgia, serif">
    <text x="0" y="0" font-size="26" font-weight="700" fill="#0A1628" letter-spacing="1">SA'DA</text>
    <text x="98" y="0" font-size="26" font-weight="700" fill="#1565C0" letter-spacing="1">H<tspan font-size="16" baseline-shift="sub" dy="4">2</tspan>O</text>
  </g>
  <g transform="translate(112 62)" font-family="'DM Sans', Helvetica, sans-serif">
    <text x="0" y="0" font-size="10" font-weight="600" fill="#607D8B" letter-spacing="4">INSTALLER PORTAL</text>
  </g>
</svg>

# nginx site for the ZATCA signing relay — HTTPS on zatca.sadawater.com,
# forwarding to the relay on 127.0.0.1:8791 (same pattern as the SMS relay).
#
#   cp deploy/nginx-zatca.sadawater.com.conf /etc/nginx/sites-available/zatca.sadawater.com
#   ln -s /etc/nginx/sites-available/zatca.sadawater.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d zatca.sadawater.com      # adds the HTTPS (443) part + auto-renewal
#
# Cloudflare Workers refuse self-signed certificates, so the Let's Encrypt step is required.

server {
    listen 80;
    listen [::]:80;
    server_name zatca.sadawater.com;

    # Only the relay's four endpoints are exposed; everything else is 404.
    location ~ ^/(health|status|onboard|sign-report)$ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Onboarding signs and submits several documents to ZATCA: allow 4 minutes.
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;

        client_max_body_size 2m;
    }

    location / {
        return 404;
    }
}

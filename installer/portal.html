<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Appointments · SA'DA H2O</title>
  <meta name="theme-color" content="#1B3A2D">

  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/manifest-installer.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SA'DA Installer">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.2.0/dist/signature_pad.umd.min.js"></script>
  <link rel="stylesheet" href="../css/inspection-report.css">
  <script defer src="../js/inspection-report.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green-deep:#1B3A2D;--green:#2D6A4F;--green-light:#40916C;--foam:#ECFDF5;--white:#FFFFFF;--text:#1A2B47;--muted:#607D8B;--border:#E2E8F0;--bg:#F8FAFC; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;}
    header{background:var(--green-deep);padding:0 24px;padding-top:env(safe-area-inset-top);height:calc(80px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
    header img{height:70px;}
    .header-right{display:flex;align-items:center;gap:16px;}
    .installer-chip{background:rgba(255,255,255,0.1);border-radius:20px;padding:6px 14px;font-size:13px;color:white;display:flex;align-items:center;gap:8px;}
    .installer-dot{width:8px;height:8px;background:#4ADE80;border-radius:50%;box-shadow:0 0 8px rgba(74,222,128,0.6);}
    .logout-btn{background:rgba(255,255,255,0.08);border:none;color:rgba(255,255,255,0.75);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:all 0.15s;}
    .logout-btn:hover{background:rgba(255,255,255,0.18);color:white;}
    .container{max-width:800px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom));}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
    .stat-card{background:white;border-radius:16px;padding:20px;border:1px solid var(--border);text-align:center;box-shadow:0 1px 3px rgba(15,23,42,0.04);transition:box-shadow 0.15s;}
    .stat-card:hover{box-shadow:0 4px 12px rgba(15,23,42,0.06);}
    .stat-icon{font-size:28px;margin-bottom:8px;}
    .stat-value{font-family:'Playfair Display',serif;font-size:28px;color:var(--text);}
    .stat-label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500;}
    .tabs{display:flex;gap:4px;margin-bottom:20px;background:white;border-radius:12px;padding:4px;border:1px solid var(--border);max-width:100%;width:fit-content;box-shadow:0 1px 3px rgba(15,23,42,0.04);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;padding:8px 20px;border-radius:9px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);background:none;transition:all 0.15s;white-space:nowrap;}
    .tab:hover:not(.active){background:var(--bg);color:var(--text);}
    .tab.active{background:var(--green);color:white;box-shadow:0 2px 8px rgba(45,106,79,0.35);}
    .loc-chip{padding:6px 13px;border-radius:100px;border:1.5px solid var(--border);background:#fff;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
    .loc-chip:hover{border-color:var(--green);color:var(--green);}
    .loc-chip.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 6px rgba(45,106,79,0.28);}
    .appointment-list{display:flex;flex-direction:column;gap:16px;}
    .appointment-card{background:white;border-radius:18px;border:1px solid var(--border);overflow:hidden;transition:box-shadow 0.15s,transform 0.15s;box-shadow:0 1px 3px rgba(15,23,42,0.04);}
    .appointment-card:hover{box-shadow:0 8px 24px rgba(15,23,42,0.08);transform:translateY(-1px);}
    .appt-header{padding:18px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
    .appt-time{background:var(--green-deep);color:white;border-radius:14px;padding:12px 16px;text-align:center;min-width:80px;flex-shrink:0;box-shadow:0 4px 12px rgba(27,58,45,0.25);}
    .appt-day{font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;}
    .appt-date-num{font-family:'Playfair Display',serif;font-size:26px;line-height:1;}
    .appt-month{font-size:12px;opacity:0.8;}
    .appt-main{flex:1;}
    .appt-hour{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}
    .appt-city{font-size:13px;color:var(--muted);margin-bottom:10px;}
    .appt-customer{background:var(--bg);border-radius:10px;padding:12px 14px;}
    .customer-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .customer-contact{display:flex;gap:16px;flex-wrap:wrap;}
    .contact-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);}
    .contact-link{color:var(--green);text-decoration:none;font-weight:600;}
    .contact-link:hover{text-decoration:underline;}
    .appt-address{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;}
    .appt-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);flex-wrap:wrap;}
    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;}
    .status-upcoming{background:#EFF6FF;color:#1D4ED8;}
    .status-in_progress{background:#FFFBEB;color:#92400E;}
    .status-completed{background:#F0FDF4;color:#166534;}
    .btn-complete{padding:10px 20px;background:linear-gradient(135deg,var(--green),var(--green-light));color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:transform 0.1s,box-shadow 0.15s;}
    .btn-complete:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(45,106,79,0.4);}
    .btn-complete:active{transform:translateY(0);}
    .btn-complete:disabled{opacity:0.55;cursor:not-allowed;}
    .btn-claim{padding:10px 20px;background:linear-gradient(135deg,#1B3A2D,#40916C);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:transform 0.1s,box-shadow 0.15s;}
    .btn-claim:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(45,106,79,0.4);}
    .btn-claim:disabled{opacity:0.55;cursor:not-allowed;}
    .badge-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;background:#EF4444;color:white;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px;}
    .when-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin-left:8px;}
    .when-today{background:#FEF3C7;color:#92400E;}
    .when-tomorrow{background:#DBEAFE;color:#1D4ED8;}
    .btn-map{padding:10px 16px;background:white;color:var(--text);border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;}
    .btn-map:hover{background:var(--bg);border-color:var(--muted);}
    .proof-section{padding:16px 22px;border-top:1px solid var(--border);background:#FAFDF9;}
    .proof-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
    .proof-uploads{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .upload-box{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.15s;background:white;display:block;}
    /* Android Chrome refuses programmatic .click() on display:none inputs, so keep
       the input in the layout but invisible and drive it with a <label for>. */
    .file-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;z-index:-1;}
    .upload-box:hover{border-color:var(--green);background:var(--foam);}
    .upload-box.has-file{border-color:var(--green);border-style:solid;background:var(--foam);}
    .upload-icon{font-size:28px;margin-bottom:8px;}
    .upload-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px;}
    .upload-sub{font-size:11px;color:var(--muted);}
    .upload-preview{width:100%;height:80px;object-fit:cover;border-radius:8px;margin-top:8px;}
    .qr-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;margin-top:8px;outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
    .qr-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,106,79,0.15);}
    .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--muted);}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
    .empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5;}
    .empty-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;}
    .modal{background:white;border-radius:20px;padding:32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
    .modal-icon{font-size:48px;text-align:center;margin-bottom:16px;}
    .modal-title{font-family:'Playfair Display',serif;font-size:22px;text-align:center;margin-bottom:8px;}
    .modal-sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px;}
    .modal-btns{display:flex;gap:12px;justify-content:center;}
    .btn-modal-cancel{padding:12px 24px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;transition:background 0.15s;}
    .btn-modal-cancel:hover{background:#F1F5F9;}
    .btn-modal-confirm{padding:12px 24px;background:var(--green);color:white;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;transition:background 0.15s;}
    .btn-modal-confirm:hover{background:var(--green-deep);}
    .error-msg{background:#FEF2F2;border:1px solid #FECACA;color:#B71C1C;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;display:none;}
    @media(max-width:640px){
      .header-right{gap:8px;}
      .installer-chip{padding:5px 10px; font-size:12px; max-width:110px;}
      .installer-chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
      .logout-btn{padding:8px 10px; font-size:12px;}
      #loc-filter{margin-left:0 !important; width:100%;}
      #city-filter{margin-left:0 !important; flex:1 1 100%; max-width:none !important;}
    }
    @media(max-width:480px){
      .stat-row{grid-template-columns:repeat(3,1fr); gap:8px;}
      .stat-card{padding:12px 8px;}
      .stat-value{font-size:22px;}
      .stat-icon{font-size:22px;}
      .stat-label{font-size:10px;}
      .container{padding:16px 12px calc(16px + env(safe-area-inset-bottom));}
      .appt-header{flex-direction:column; gap:12px;}
      .appt-time{display:flex; gap:12px; align-items:center; border-radius:10px; padding:10px 14px; min-width:unset; width:100%;}
      .appt-date-num{font-size:20px;}
      .appt-main{width:100%;}
      .appt-footer{flex-direction:column; align-items:flex-start; gap:10px;}
      .appt-footer > div{width:100%; display:flex; gap:8px;}
      .btn-complete{flex:1; text-align:center;}
      .btn-map{flex:1; justify-content:center;}
      .proof-uploads{grid-template-columns:1fr;}
      .modal{padding:20px 16px; border-radius:16px 16px 0 0; margin:0; max-width:100%;}
      .modal-overlay{align-items:flex-end; padding:0;}
      header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));height:auto;}
      header img{height:52px;}
    }
    @media(prefers-reduced-motion:reduce){
      *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
    }
  </style>
</head>
<body>
<header>
  <img src="../assets/SADA_h2o_logo.png" alt="SA'DA H2O">
  <div class="header-right">
    <div class="installer-chip"><div class="installer-dot"></div><span id="installer-name">Loading...</span></div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="container">
  <div class="stat-row">
    <div class="stat-card"><div class="stat-icon">🔔</div><div class="stat-value" id="stat-available">—</div><div class="stat-label">Available</div></div>
    <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-value" id="stat-upcoming">—</div><div class="stat-label">My Upcoming</div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="stat-done">—</div><div class="stat-label">Completed</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="filterTab('available',this)">Available <span class="badge-count" id="badge-available" style="display:none;"></span></button>
    <button class="tab" onclick="filterTab('upcoming',this)">My Upcoming</button>
    <button class="tab" onclick="filterTab('in_progress',this)">In Progress</button>
    <button class="tab" onclick="filterTab('completed',this)">Completed</button>
  </div>
  <div id="loc-filter" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px;">
    <div id="region-chips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    <select id="city-filter" onchange="renderAppointments()" style="margin-left:auto;padding:7px 10px;border:1.5px solid var(--border,#d5dde3);border-radius:9px;font-size:13px;background:#fff;color:inherit;max-width:180px;">
      <option value="">All cities</option>
    </select>
  </div>
  <div class="appointment-list" id="appointments-list">
    <div class="loading"><div class="spinner"></div> Loading appointments...</div>
  </div>
</div>


<script>
const SUPABASE_URL = 'https://ykgtrloptgazeqjgxney.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrZ3RybG9wdGdhemVxamd4bmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NjAxODEsImV4cCI6MjA5MjQzNjE4MX0.4yr-4mlvQQSw7R6qNUYmDfLA4ITVC09Iei2k3JB6M4A';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Expose to the inspection-report module (js/inspection-report.js reads window.db).
window.db = db;

// YYYY-MM-DD in the LOCAL calendar — never in UTC. See shared/supabase.js for
// why: `d.toISOString().split('T')[0]` reports the previous day in KSA (UTC+3)
// for anything from local midnight to 03:00.
function localDateISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

let installerId = null;
let installerPhone = '';
let myBookings = [];       // bookings assigned to me
let availableBookings = []; // unassigned upcoming — pool for everyone
let serviceRegions = [];    // [{id,name}] for the location filter
let officialCities = [];    // [{name, region_id}] — the exact cities customers can book
let activeRegionId = '';    // '' = all regions

// Match a booking's (messy, free-text) city_name to one of the official cities a
// customer can actually book. Returns the official city name, or '' if none matches.
function matchCity(raw) {
  const s = (raw || '').toLowerCase().replace(/[^a-z]/g, '');
  if (!s) return '';
  // exact-ish contains match against the official list, longest name first so
  // "Al Khobar" wins over a bare token.
  const sorted = officialCities.slice().sort((a, b) => b.name.length - a.name.length);
  for (const c of sorted) {
    const key = c.name.toLowerCase().replace(/[^a-z]/g, '');   // "alkhobar", "dammam"
    if (s.includes(key) || key.includes(s)) return c.name;
  }
  // common aliases the official names don't cover literally
  if (s.includes('khobar')) return 'Al Khobar';
  if (s.includes('hofuf') || s.includes('hufuf') || s.includes('ahsa')) return 'Al Ahsa';
  return '';
}
let reportsByBooking = {};  // { [bookingId]: { id, status } } — submitted/draft state per booking
let itemsByBooking = {};    // { [bookingId]: [{product_model, qty, is_serialized}] } — what to bring
let activeTab = 'available';
let realtimeChannel = null;

window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  installerId = session.user.id;
  const { data: inst } = await db.from('installers').select('name, phone').eq('id', installerId).maybeSingle();
  if (inst) {
    document.getElementById('installer-name').textContent = inst.name;
    installerPhone = inst.phone || '';
  }

  requestNotificationPermission();
  const [{ data: regs }, { data: cits }] = await Promise.all([
    db.from('service_regions').select('id, name').order('name'),
    db.from('cities').select('name, region_id').order('name')
  ]);
  serviceRegions = regs || [];
  officialCities = cits || [];
  await loadAll();
  buildLocationFilter();
  subscribeRealtime();
  notifyUpcomingToday();
});


// ============================================================
// SESSION GUARD — the portal stays open all day on a phone. If the login token
// expires, writes silently fail (RLS rejects the anon role) while reads still
// work, which looks like "the app did nothing". Refresh before every write.
// ============================================================
async function ensureSession() {
  let { data: { session } } = await db.auth.getSession();
  const expSoon = session?.expires_at && (session.expires_at * 1000 - Date.now() < 120000);
  if (!session || expSoon) {
    try { const { data } = await db.auth.refreshSession(); session = data?.session || null; } catch (e) { session = null; }
  }
  if (!session) {
    alert('Your session expired. Please sign in again — your photos are still on your phone, nothing is lost.');
    window.location.href = 'login.html';
    return false;
  }
  installerId = session.user.id;
  return true;
}
setInterval(() => { try { db.auth.getSession().catch(()=>{}); } catch(e){} }, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { try { db.auth.getSession().catch(()=>{}); } catch(e){} }
});

async function loadAll() {
  const todayIso = localDateISO(new Date());
  const [mine, avail] = await Promise.all([
    db.from('bookings').select('*').eq('installer_id', installerId)
      .order('slot_date', { ascending: true }).order('slot_hour', { ascending: true }),
    db.from('bookings').select('*').is('installer_id', null).eq('status', 'upcoming')
      .gte('slot_date', todayIso)
      .order('slot_date', { ascending: true }).order('slot_hour', { ascending: true })
  ]);
  myBookings = mine.data || [];
  availableBookings = avail.data || [];

  // Load the product lines for every visible job so each card can tell the
  // installer exactly what to load in the van before leaving.
  itemsByBooking = {};
  const allIds = [...myBookings, ...availableBookings].map(b => b.id);
  if (allIds.length) {
    const { data: items } = await db.from('booking_items')
      .select('booking_id, product_model, qty, is_serialized').in('booking_id', allIds);
    (items || []).forEach(it => {
      (itemsByBooking[it.booking_id] = itemsByBooking[it.booking_id] || []).push(it);
    });
  }

  // Load submitted/draft inspection reports for MY bookings so the UI can
  // gate "Mark Complete" on the presence of a submitted report.
  reportsByBooking = {};
  if (myBookings.length) {
    const ids = myBookings.map(b => b.id);
    const { data: reports } = await db.from('inspection_reports')
      .select('id, booking_id, status, submitted_at').in('booking_id', ids);
    (reports || []).forEach(r => {
      // If multiple exist for one booking (shouldn't, due to unique constraint), prefer submitted.
      const existing = reportsByBooking[r.booking_id];
      if (!existing || (r.status === 'submitted' && existing.status !== 'submitted')) {
        reportsByBooking[r.booking_id] = { id: r.id, status: r.status, submitted_at: r.submitted_at };
      }
    });
  }

  document.getElementById('stat-available').textContent = availableBookings.length;
  document.getElementById('stat-upcoming').textContent = myBookings.filter(b => b.status === 'upcoming').length;
  document.getElementById('stat-done').textContent = myBookings.filter(b => b.status === 'completed').length;

  const badge = document.getElementById('badge-available');
  if (availableBookings.length) { badge.textContent = availableBookings.length; badge.style.display = 'inline-flex'; }
  else badge.style.display = 'none';

  if (typeof buildLocationFilter === 'function' && serviceRegions.length) buildLocationFilter();
  renderAppointments();
}

function subscribeRealtime() {
  if (realtimeChannel) realtimeChannel.unsubscribe();
  realtimeChannel = db.channel('bookings-installer-feed')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, async (payload) => {
      const row = payload.new;
      if (row.installer_id === null && row.status === 'upcoming') {
        showBrowserNotification(
          'New job available',
          `${row.customer_name} · ${row.city_name} · ${formatDateLocal(row.slot_date)} ${formatHour(row.slot_hour)}`
        );
        await loadAll();
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bookings' }, async () => {
      await loadAll();  // someone claimed / admin changed something
    })
    .subscribe();
}

function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission();
}

function showBrowserNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: '/assets/apple-touch-icon.png', tag: 'sada-installer' });
  } catch (e) { console.warn('Notification failed', e); }
}

function notifyUpcomingToday() {
  const today = localDateISO(new Date());
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowIso = localDateISO(tomorrow);
  const todays = myBookings.filter(b => b.slot_date === today && b.status === 'upcoming');
  const tomorrows = myBookings.filter(b => b.slot_date === tomorrowIso && b.status === 'upcoming');
  if (todays.length) showBrowserNotification(`You have ${todays.length} job(s) today`, todays.map(b => `${formatHour(b.slot_hour)} · ${b.customer_name}`).join('\n'));
  else if (tomorrows.length) showBrowserNotification(`You have ${tomorrows.length} job(s) tomorrow`, tomorrows.map(b => `${formatHour(b.slot_hour)} · ${b.customer_name}`).join('\n'));
}

function filterTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAppointments();
}

function whenBadge(slotDate) {
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const d = new Date(slotDate + 'T00:00:00');
  if (d.getTime() === today.getTime()) return '<span class="when-badge when-today">Today</span>';
  if (d.getTime() === tomorrow.getTime()) return '<span class="when-badge when-tomorrow">Tomorrow</span>';
  return '';
}

// Build the region chips + city dropdown from the bookings currently in view.
function buildLocationFilter() {
  const chipWrap = document.getElementById('region-chips');
  const citySel = document.getElementById('city-filter');
  if (!chipWrap || !citySel) return;

  // Only show regions that actually have jobs assigned to / available for this installer.
  const pool = myBookings.concat(availableBookings);
  const regionIdsInUse = new Set(pool.map(b => b.service_region_id).filter(Boolean));

  // If the remembered region has no jobs right now, fall back to "All areas" so
  // the installer never lands on an empty, confusing view.
  if (activeRegionId && !regionIdsInUse.has(activeRegionId)) activeRegionId = '';

  const chips = [`<button class="loc-chip${activeRegionId==='' ? ' on':''}" onclick="setRegion('')">All areas</button>`];
  serviceRegions
    .filter(r => regionIdsInUse.has(r.id))
    .forEach(r => chips.push(`<button class="loc-chip${activeRegionId===r.id ? ' on':''}" onclick="setRegion('${r.id}')">${r.name}</button>`));
  chipWrap.innerHTML = chips.join('');

  // City dropdown — only official cities that (a) have jobs in the pool and
  // (b) belong to the selected region (if any). No free-text guesses.
  const citiesWithJobs = new Set();
  pool.forEach(b => {
    if (activeRegionId && b.service_region_id !== activeRegionId) return;
    const c = matchCity(b.city_name);
    if (c) citiesWithJobs.add(c);
  });
  const ordered = officialCities
    .map(c => c.name)
    .filter((n, i, a) => a.indexOf(n) === i && citiesWithJobs.has(n));
  const prev = citySel.value;
  citySel.innerHTML = '<option value="">All cities</option>' +
    ordered.map(c => `<option value="${c}">${c}</option>`).join('');
  citySel.value = ordered.includes(prev) ? prev : '';
}

function setRegion(id) {
  activeRegionId = id;
  buildLocationFilter();   // refresh chips + city list for this region
  renderAppointments();
}

// Apply the active region + city filter to a list of bookings.
function applyLocationFilter(rows) {
  const city = (document.getElementById('city-filter') || {}).value || '';
  return rows.filter(b => {
    if (activeRegionId && b.service_region_id !== activeRegionId) return false;
    if (city && matchCity(b.city_name) !== city) return false;
    return true;
  });
}

// ---- What kind of visit is this? Drives the coloured badge on every job card.
const JOB_TYPES = {
  installation:     { label: 'NEW INSTALLATION', icon: '🔧', bg: '#DBEAFE', fg: '#1D4ED8' },
  repair:           { label: 'REPAIR / FIX',     icon: '🛠️', bg: '#FEE2E2', fg: '#B91C1C' },
  quarterly_service:{ label: 'FILTER CHANGE',    icon: '🔄', bg: '#FEF3C7', fg: '#B45309' },
  annual_service:   { label: 'ANNUAL SERVICE',   icon: '📅', bg: '#EDE9FE', fg: '#6D28D9' },
  relocation:       { label: 'RELOCATION',       icon: '🚚', bg: '#FFE4E6', fg: '#BE123C' },
  inspection:       { label: 'INSPECTION',       icon: '🔍', bg: '#CCFBF1', fg: '#0F766E' }
};
function jobTypeOf(b) {
  return JOB_TYPES[(b.booking_type || 'installation')] ||
    { label: String(b.booking_type || 'VISIT').replace(/_/g,' ').toUpperCase(), icon: '📌', bg: '#F1F5F9', fg: '#475569' };
}
function jobTypeBadge(b) {
  const t = jobTypeOf(b);
  return `<span style="display:inline-flex;align-items:center;gap:5px;background:${t.bg};color:${t.fg};font-size:11px;font-weight:800;letter-spacing:.3px;padding:4px 10px;border-radius:20px;white-space:nowrap;">${t.icon} ${t.label}</span>`;
}

// ---- What the installer must load in the van for this job.
function equipmentPanel(b) {
  const items = itemsByBooking[b.id] || [];
  let lines;
  if (items.length) {
    lines = items.map(it => ({ name: it.product_model, qty: it.qty || 1 }));
  } else if (b.product_model) {
    lines = [{ name: b.product_model, qty: b.product_qty || 1 }];
  } else {
    lines = [];
  }
  const type = (b.booking_type || 'installation');
  const isService = type === 'quarterly_service' || type === 'annual_service' || type === 'repair';

  const body = lines.length
    ? lines.map(l => `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #E2E8F0;">
         <span style="font-weight:700;font-size:13px;color:#0A1628;">${l.name}</span>
         <span style="font-weight:800;font-size:13px;color:#0D3B6E;white-space:nowrap;">× ${l.qty}</span>
       </div>`).join('')
    : `<div style="font-size:12px;color:#B45309;">No product recorded — call the office before you go.</div>`;

  const note = type === 'relocation'
    ? `<div style="font-size:11px;color:#BE123C;margin-top:7px;">Relocation — uninstall at the old address and refit at the new one. Bring fittings and spare tubing, and re-capture the location on site.</div>`
    : isService
    ? `<div style="font-size:11px;color:#92400E;margin-top:7px;">Service visit — bring the matching filter set / spares for the unit above.</div>`
    : `<div style="font-size:11px;color:var(--muted);margin-top:7px;">Bring the unit(s) above plus fittings. QR sticker photo is required to finish.</div>`;

  const panelTitle = (type === 'installation') ? '📦 What to bring' : '📦 Unit on site';

  return `<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:11px 13px;margin-top:10px;">
      <div style="font-size:11px;font-weight:800;letter-spacing:.4px;color:#64748B;text-transform:uppercase;margin-bottom:6px;">${panelTitle}</div>
      ${body}${note}
    </div>`;
}


// Where should the Directions button point?
//  1. an exact GPS pin, if we have one
//  2. a Google Maps link the office pasted (short links carry no coordinates,
//     so we open the link itself rather than searching for its text)
//  3. otherwise search the address / city
function destinationUrl(b) {
  if (b.latitude && b.longitude) {
    return `https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}`;
  }
  const addr = b.location_address || '';
  const link = addr.match(/https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|maps\.google\.[a-z.]+|www\.google\.[a-z.]+\/maps)\S*/i);
  if (link) return link[0];
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr || b.city_name || '')}`;
}

function renderAppointments() {
  const list = document.getElementById('appointments-list');
  let filtered;
  if (activeTab === 'available') filtered = availableBookings;
  else if (activeTab === 'completed') filtered = myBookings.filter(b => b.status === 'installed' || b.status === 'completed');
  else filtered = myBookings.filter(b => b.status === activeTab);
  filtered = applyLocationFilter(filtered);

  if (!filtered.length) {
    const emptyMsg = activeTab === 'available'
      ? { icon: '🎯', title: 'No available jobs right now', sub: 'You\'ll be notified when new bookings come in.' }
      : activeTab === 'completed'
      ? { icon: '🎉', title: 'No completed jobs yet', sub: '' }
      : { icon: '📭', title: 'No appointments here', sub: '' };
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">${emptyMsg.icon}</div><div class="empty-title">${emptyMsg.title}</div><div style="font-size:13px;color:var(--muted);margin-top:6px;">${emptyMsg.sub}</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(b => {
    const d = new Date(b.slot_date + 'T00:00:00');
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const mapsUrl = destinationUrl(b);
    const proofSection = b.status === 'completed' && b.proof_photo_url ? `
      <div class="proof-section">
        <div class="proof-title">📸 Installation Proof</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <img src="${b.proof_photo_url}" style="height:80px;border-radius:8px;object-fit:cover;" alt="Photo">
          ${b.proof_qr_url ? `<img src="${b.proof_qr_url}" style="height:80px;border-radius:8px;object-fit:cover;" alt="QR">` : ''}
          ${b.proof_qr_code ? `<div style="font-size:12px;color:var(--muted);align-self:center;">Serial: <strong>${b.proof_qr_code}</strong></div>` : ''}
        </div>
      </div>` : '';

    // Actions depend on tab
    let actions;
    if (activeTab === 'available') {
      actions = `
        <a href="${mapsUrl}" target="_blank" class="btn-map">🗺️ Directions</a>
        <button class="btn-claim" onclick="claimJob('${b.id}')" id="claim-${b.id}">✋ Claim this Job</button>`;
    } else {
      // One button does it all now: the inspection report form (checklist,
      // water analysis, photos, GPS, signatures) finishes the job on submit —
      // see js/inspection-report.js. No separate "Mark Complete" step.
      const rep = reportsByBooking[b.id];
      const reportDraft = rep && rep.status === 'draft';
      let jobBtn = '';
      if (b.status === 'completed' || b.status === 'installed') {
        jobBtn = '<span style="font-size:13px;color:var(--muted);">✓ Done</span>';
      } else if (b.status !== 'cancelled') {
        jobBtn = `<button class="btn-complete" onclick="openInspectionReport('${b.id}')">${reportDraft ? '📝 Continue Report' : '📋 Fill Inspection Report'}</button>`;
      }

      actions = `
        <a href="${mapsUrl}" target="_blank" class="btn-map">🗺️ Directions</a>
        ${jobBtn}`;
    }

    return `
      <div class="appointment-card">
        <div class="appt-header">
          <div class="appt-time">
            <div class="appt-day">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
            <div class="appt-date-num">${dd}</div>
            <div class="appt-month">${mm}/${d.getFullYear()}</div>
          </div>
          <div class="appt-main">
            <div style="margin-bottom:6px;">${jobTypeBadge(b)}</div>
            <div class="appt-hour">🕐 ${formatHour(b.slot_hour)} ${whenBadge(b.slot_date)}</div>
            <div class="appt-city">📍 ${b.city_name}</div>
            <div class="appt-customer">
              <div class="customer-name">👤 ${b.customer_name}</div>
              <div class="customer-contact">
                <div class="contact-item"><span>📞</span><a href="tel:${b.customer_phone}" class="contact-link">${b.customer_phone}</a></div>
              </div>
              ${b.location_address ? `<div class="appt-address"><span>🏠</span> ${b.location_address}</div>` : ''}
            </div>
            ${equipmentPanel(b)}
          </div>
        </div>
        ${proofSection}
        <div class="appt-footer">
          <span class="status-badge status-${b.status}">${activeTab === 'available' ? '🔔 Open' : getStatusLabel(b.status)}</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${actions}
          </div>
        </div>
      </div>`;
  }).join('');
}

async function claimJob(bookingId) {
  if (!(await ensureSession())) return;
  const btn = document.getElementById(`claim-${bookingId}`);
  if (btn) { btn.disabled = true; btn.textContent = 'Claiming…'; }

  // Atomic claim: only succeeds if installer_id IS NULL (RLS + WHERE clause).
  const { data, error } = await db.from('bookings')
    .update({ installer_id: installerId })
    .eq('id', bookingId)
    .is('installer_id', null)
    .select();

  if (error) {
    // A real error (network drop, expired session, RLS rejection) is not the
    // same as losing the race — don't tell the installer someone else took the
    // job when the job is probably still sitting there open.
    if (btn) { btn.disabled = false; btn.textContent = '✋ Claim this Job'; }
    alert('Could not claim this job: ' + error.message + '\n\nPlease try again.');
    return;
  }
  if (!data || !data.length) {
    if (btn) { btn.disabled = false; btn.textContent = '✋ Claim this Job'; }
    alert('Someone else just claimed this job. Refreshing the list…');
    await loadAll();
    return;
  }
  showBrowserNotification('Job claimed', `${data[0].customer_name} · ${formatDateLocal(data[0].slot_date)}`);
  await loadAll();
  // Switch to My Upcoming so they see it landed
  activeTab = 'upcoming';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[1]?.classList.add('active');
  renderAppointments();
}

function formatDateLocal(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function formatHour(hour) {
  const h = parseInt(hour);
  if (isNaN(h) || h < 0 || h > 23) return String(hour);
  const next = (h + 1) % 24;
  const label = (n) => {
    const period = n >= 12 && n < 24 ? 'PM' : 'AM';
    const twelve = n % 12 === 0 ? 12 : n % 12;
    return `${twelve}:00 ${period}`;
  };
  return `${label(h)} – ${label(next)}`;
}

function getStatusLabel(s) { return {upcoming:'Upcoming',in_progress:'In Progress',completed:'Completed',cancelled:'Cancelled'}[s] || s; }

function openInspectionReport(bookingId) {
  if (!window.SADA || !window.SADA.InspectionReport) { alert('Report module not loaded'); return; }
  const nameEl = document.getElementById('installer-name');
  // Pull the QR serial already scanned for this booking (if any) so it prefills Serial No.
  const bk = myBookings.find(x => x.id === bookingId);
  // The report form now handles the completion photos/GPS/warranty-creation
  // itself as part of one submit — see js/inspection-report.js. Just reload
  // the list afterward so the booking's new status/badges show up.
  window.SADA.InspectionReport.openForm(bookingId, {
    installerId: installerId,
    installerName: nameEl ? nameEl.textContent : '',
    installerPhone: installerPhone,
    scannedSerial: bk ? (bk.proof_qr_code || '') : '',
    onSaved: () => loadAll()
  });
}
async function logout() {
  if (realtimeChannel) realtimeChannel.unsubscribe();
  await db.auth.signOut();
  window.location.href = 'login.html';
}

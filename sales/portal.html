<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sales Portal · SA'DA H2O</title>
  <meta name="theme-color" content="#0A1628">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SA'DA Sales">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0A1628; --blue: #1565C0; --blue-dark: #0D3B6E;
      --ink: #1A2B47; --muted: #607D8B; --line: #E2E8F0; --bg: #F1F5F9;
      --danger: #B71C1C; --ok: #0d7a63;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }
    button { font-family: inherit; }

    .topbar {
      background: linear-gradient(160deg, var(--navy) 0%, var(--blue-dark) 70%, var(--blue) 100%);
      color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar img { height: 34px; filter: brightness(0) invert(1); }
    .topbar .who { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.3; opacity: .9; min-width: 0; }
    .topbar .who b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signout { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .signout:hover { background: rgba(255,255,255,.24); }

    .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .tab { flex: 1; padding: 14px 8px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
    .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(10,22,40,.08); }
    .card h2 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--navy); margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } .row.keep { grid-template-columns: 1fr 1fr; } }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; letter-spacing: .3px; }
    label .opt { color: var(--muted); font-weight: 400; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
      font-family: inherit; font-size: 15px; background: #fff; color: var(--ink); outline: none;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,101,192,.15); }

    .btn { border: 0; border-radius: 12px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--blue-dark), var(--blue)); color: #fff; width: 100%; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .btn-sm { padding: 9px 14px; font-size: 13px; border-radius: 10px; }

    .add-row { display: flex; gap: 8px; }
    .add-row select { flex: 1; }
    .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .line .nm { flex: 1 1 160px; min-width: 0; font-size: 14px; font-weight: 600; }
    .line .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
    .line select { width: auto; padding: 8px 10px; font-size: 13px; }
    .qty { display: inline-flex; align-items: center; gap: 4px; }
    .qty button { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-size: 16px; cursor: pointer; }
    .qty span { min-width: 24px; text-align: center; font-weight: 600; }
    .line .amt { min-width: 84px; text-align: right; font-size: 14px; font-weight: 600; }
    .rm { border: 0; background: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px 8px; }
    .total { display: flex; justify-content: space-between; padding-top: 12px; font-weight: 700; font-size: 16px; }
    .hint { font-size: 13px; color: var(--muted); }

    .location-btn { width: 100%; padding: 14px; background: #EAF2FB; border: 2px dashed var(--blue); border-radius: 12px; color: var(--blue); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, border-color .15s, color .15s; }
    .location-btn:hover:not(:disabled) { background: #DBEAFE; }
    .location-btn:disabled { opacity: .75; cursor: progress; }
    .location-btn.got-location { background: #ECFDF5; border: 2px solid #16A34A; border-style: solid; color: #15803D; }
    .location-btn.got-location:hover { background: #DCFCE7; }
    .location-btn.error-location { background: #FEF2F2; border: 2px solid var(--danger); border-style: solid; color: var(--danger); }
    .location-btn.error-location:hover { background: #FEE2E2; }
    .location-hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .location-hint.error { color: var(--danger); }
    #location-map { display: none; margin-top: 12px; height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
    #location-map.visible { display: block; }
    .map-caption { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

    .slots { display: flex; flex-wrap: wrap; gap: 8px; }
    .slot { min-width: 108px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); }
    .slot:hover:not(:disabled) { border-color: var(--blue); }
    .slot.sel { background: var(--blue); border-color: var(--blue); color: #fff; }
    .slot.booked, .slot:disabled { text-decoration: line-through; color: #94A3B8; background: #F8FAFC; cursor: not-allowed; }

    .err { background: #FEF2F2; border: 1px solid #FECACA; color: var(--danger); padding: 12px 14px; border-radius: 10px; font-size: 13px; margin: 12px 0; display: none; }
    .done { text-align: center; padding: 26px 18px; }
    .done .tick { width: 56px; height: 56px; border-radius: 50%; background: #E6F6F1; color: var(--ok); font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .done .ref { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--navy); margin: 6px 0 14px; }
    .done dl { text-align: left; max-width: 340px; margin: 0 auto 18px; font-size: 14px; }
    .done dt { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .done .btns { display: flex; gap: 10px; flex-direction: column; max-width: 340px; margin: 0 auto; }

    .stats-row { display: flex; gap: 10px; margin: 14px 16px 0; }
    .stat-tile { flex: 1; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(10,22,40,.08); text-align: center; }
    .stat-num { display: block; font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.15; }
    .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }

    .lead-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .lead-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .lead-filter button { border: 1.5px solid var(--line); background: #fff; color: var(--muted); font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
    .lead-filter button.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .bk-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .bk-head input { flex: 1; }
    .count { font-size: 12px; color: var(--muted); margin: 0 4px 10px; }
    .bk { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(10,22,40,.08); }
    .bk-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .bk-top .nm { font-size: 16px; font-weight: 700; }
    .bk-top a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14px; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; }
    .bk-meta { margin-top: 8px; font-size: 13px; color: #334155; line-height: 1.55; }
    .bk-meta .k { color: var(--muted); }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 50; display: none; max-width: 90vw; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header class="topbar">
  <img src="../assets/SADA_h2o_logo.png" alt="SA'DA H2O">
  <div class="who"><b id="who-name">…</b><span>Sales</span></div>
  <button class="signout" id="signout-btn" type="button">Sign out</button>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" id="tab-new" type="button" role="tab" data-tab="new">New Booking</button>
  <button class="tab" id="tab-leads" type="button" role="tab" data-tab="leads">Leads</button>
  <button class="tab" id="tab-mine" type="button" role="tab" data-tab="mine">My Bookings</button>
</nav>

<div class="stats-row" aria-label="Your booking totals">
  <div class="stat-tile"><span class="stat-num" id="stat-today">–</span><span class="stat-label">Booked Today</span></div>
  <div class="stat-tile"><span class="stat-num" id="stat-month">–</span><span class="stat-label">Booked This Month</span></div>
</div>

<main class="wrap">
  <!-- ═════════ NEW BOOKING ═════════ -->
  <section id="pane-new">
    <div id="form-area">
      <div class="card">
        <h2>Customer</h2>
        <div class="row">
          <div class="field"><label for="f-name">Full name</label><input id="f-name" autocomplete="off" maxlength="80"></div>
          <div class="field"><label for="f-phone">Mobile number</label><input id="f-phone" type="tel" inputmode="numeric" placeholder="05XXXXXXXX" autocomplete="off" maxlength="16"></div>
        </div>
      </div>

      <div class="card">
        <h2>Installation address</h2>
        <div class="row">
          <div class="field"><label for="f-region">Region</label><select id="f-region"></select></div>
          <div class="field"><label for="f-city">City</label><select id="f-city"></select></div>
        </div>
        <div class="field">
          <label for="f-address">Address</label>
          <button type="button" class="location-btn" id="location-btn"><span>📍</span> <span id="location-btn-label">Use My Current Location</span></button>
          <div class="location-hint" id="location-hint">Tap to fill the address from GPS. You can drag the pin on the map to fine-tune.</div>
          <textarea id="f-address" maxlength="300" placeholder="District, street, building, landmark" style="margin-top:10px"></textarea>
          <div id="location-map" aria-label="Draggable map pin"></div>
          <div class="map-caption" id="map-caption" style="display:none;">Drag the pin to the customer's exact door.</div>
        </div>
        <div class="row keep">
          <div class="field"><label for="f-floor">Floor no <span class="opt">(optional)</span></label><input id="f-floor" maxlength="20"></div>
          <div class="field"><label for="f-flat">Flat no <span class="opt">(optional)</span></label><input id="f-flat" maxlength="20"></div>
        </div>
      </div>

      <div class="card">
        <h2>Choose your product</h2>
        <div class="add-row">
          <select id="f-product"></select>
          <button class="btn btn-ghost btn-sm" id="add-product" type="button">Add</button>
        </div>
        <div id="basket"></div>
        <div class="field" style="margin:14px 0 0">
          <label for="f-promo">Promo code <span class="opt">(optional)</span></label>
          <div class="add-row">
            <input id="f-promo" autocomplete="off" maxlength="40" style="text-transform:uppercase" placeholder="Enter code">
            <button class="btn btn-ghost btn-sm" id="promo-btn" type="button">Apply</button>
          </div>
          <div id="promo-msg" class="hint" style="margin-top:6px" hidden></div>
        </div>
      </div>

      <div class="card">
        <h2>Choose a time slot</h2>
        <div class="field"><label for="f-date">Date</label><select id="f-date"></select></div>
        <div class="slots" id="slots"><span class="hint">Pick a date to see the times.</span></div>
      </div>

      <div class="card">
        <div class="field" style="margin-bottom:0"><label for="f-source">How did the customer hear about us?</label>
          <select id="f-source"></select></div>
      </div>

      <div class="err" id="form-err" role="alert"></div>
      <button class="btn btn-primary" id="submit-btn" type="button">Confirm booking</button>
    </div>

    <div class="card done" id="done-area" hidden>
      <div class="tick">✓</div>
      <div>Booking confirmed</div>
      <div class="ref" id="done-ref"></div>
      <dl id="done-details"></dl>
      <div class="btns">
        <button class="btn btn-primary" id="another-btn" type="button">Add another booking</button>
        <button class="btn btn-ghost" id="view-mine-btn" type="button">View my bookings</button>
      </div>
    </div>
  </section>

  <!-- ═════════ LEADS ═════════ -->
  <section id="pane-leads" hidden>
    <div class="card">
      <h2>Add a lead</h2>
      <div class="row">
        <div class="field"><label for="l-name">Full name</label><input id="l-name" autocomplete="off" maxlength="80"></div>
        <div class="field"><label for="l-phone">Mobile number</label><input id="l-phone" type="tel" inputmode="numeric" placeholder="05XXXXXXXX" autocomplete="off" maxlength="16"></div>
      </div>
      <div class="row">
        <div class="field"><label for="l-region">Region <span class="opt">(optional)</span></label><select id="l-region"><option value="">— Not sure yet —</option></select></div>
        <div class="field"><label for="l-city">City <span class="opt">(optional)</span></label><select id="l-city"><option value="">— Not sure yet —</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label for="l-product">Interested in <span class="opt">(optional)</span></label><select id="l-product"><option value="">— Not sure yet —</option></select></div>
        <div class="field"><label for="l-source">How did they hear about us? <span class="opt">(optional)</span></label><select id="l-source"></select></div>
      </div>
      <div class="field" style="margin-bottom:0"><label for="l-notes">Notes <span class="opt">(optional)</span></label><textarea id="l-notes" maxlength="500" placeholder="Anything worth remembering for the follow-up"></textarea></div>
      <div class="err" id="lead-err" role="alert" style="margin-bottom:0"></div>
      <button class="btn btn-primary" id="lead-submit-btn" type="button" style="margin-top:14px">Add lead</button>
    </div>

    <div class="lead-filter" role="tablist" aria-label="Filter leads">
      <button type="button" class="active" data-lf="open">Open</button>
      <button type="button" data-lf="converted">Converted</button>
      <button type="button" data-lf="lost">Lost</button>
      <button type="button" data-lf="all">All</button>
    </div>
    <div class="count" id="lead-count"></div>
    <div id="lead-list"></div>
  </section>

  <!-- ═════════ MY BOOKINGS ═════════ -->
  <section id="pane-mine" hidden>
    <div class="bk-head">
      <input id="search" type="search" placeholder="Search name, phone, reference…" autocomplete="off">
      <button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">Refresh</button>
    </div>
    <div class="count" id="count"></div>
    <div id="bk-list"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="../shared/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  // Sales users only ever talk to /api/sales/ops (server-scoped to their own
  // bookings). The only direct reads below are public reference data — regions,
  // cities, the product catalogue and open slots — which the customer booking
  // page reads too.
  const SOURCES = ['Phone Call', 'WhatsApp', 'Instagram', 'Snapchat', 'TikTok', 'Google Search',
    'Friend / Family', 'Existing Customer', 'Direct Sales', 'Dammam Showroom', 'Khobar Showroom',
    'Lulu Kiosk', 'Exhibition / Event', 'Flyer / Billboard', 'Other'];
  const COLORS = ['Black', 'White'];
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isDispenser = (n) => String(n).toLowerCase().includes('dispenser');
  const money = (n) => 'SAR ' + Number(n || 0).toLocaleString('en-US');

  let catalogue = [], basket = [], promo = null, selectedSlot = null, myBookings = null, submitting = false;
  let gpsLat = null, gpsLon = null, leafletMap = null, leafletMarker = null;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  // ── session / API ──────────────────────────────────────────────────────────
  async function api(action, extra) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = '../admin/login.html'; throw new Error('Please sign in.'); }
    const r = await fetch('/api/sales/ops', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ action, ...(extra || {}) })
    });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { await db.auth.signOut(); window.location.href = '../admin/login.html'; throw new Error(body.error || 'Please sign in.'); }
    if (!r.ok) { const e = new Error(body.error || 'Something went wrong. Please try again.'); e.status = r.status; throw e; }
    return body;
  }

  async function guard() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = '../admin/login.html'; return null; }
    try { return await api('me'); }
    catch (e) {
      if (e.status === 403) {
        // Admins wandering in here go back to their console; anyone else is signed out.
        const { data: isAdmin } = await db.rpc('is_admin');
        if (isAdmin) { window.location.href = '../admin/dashboard.html'; return null; }
        await db.auth.signOut();
        window.location.href = '../admin/login.html';
      }
      return null;
    }
  }

  // ── tabs ───────────────────────────────────────────────────────────────────
  function showTab(name) {
    $('pane-new').hidden = name !== 'new';
    $('pane-leads').hidden = name !== 'leads';
    $('pane-mine').hidden = name !== 'mine';
    $('tab-new').classList.toggle('active', name === 'new');
    $('tab-leads').classList.toggle('active', name === 'leads');
    $('tab-mine').classList.toggle('active', name === 'mine');
    if (name === 'mine') loadMine();
    if (name === 'leads') loadLeads();
    window.scrollTo(0, 0);
  }

  // ── reference data ─────────────────────────────────────────────────────────
  let regionsCache = [];
  async function loadRegions() {
    const { data } = await db.from('service_regions').select('id, name').order('sort_order');
    regionsCache = data || [];
    const opts = regionsCache.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('') || '<option value="">— no regions —</option>';
    $('f-region').innerHTML = opts;
    $('l-region').innerHTML = '<option value="">— Not sure yet —</option>' + opts;
    await onRegionChange();
  }

  async function onRegionChange() {
    const regionId = $('f-region').value;
    const { data } = await db.from('cities').select('id, name').eq('region_id', regionId).order('name');
    $('f-city').innerHTML = (data || []).map((c) => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')
      || '<option value="">— no cities —</option>';
    await loadDates();
  }

  // Independent of the booking form's region/city (no slot/date side effects —
  // a lead isn't tied to an appointment yet).
  async function onLeadRegionChange() {
    const regionId = $('l-region').value;
    const citySel = $('l-city');
    if (!regionId) { citySel.innerHTML = '<option value="">— Not sure yet —</option>'; return; }
    const { data } = await db.from('cities').select('id, name').eq('region_id', regionId).order('name');
    citySel.innerHTML = '<option value="">— Not sure yet —</option>' + (data || []).map((c) => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  }

  async function loadCatalogue() {
    const { data } = await db.from('product_models')
      .select('model_name, price_sar, in_stock, is_catalogue, sort_order')
      .eq('is_catalogue', true).order('sort_order', { ascending: true });
    catalogue = (data || []).filter((p) => p.in_stock !== false);
    $('f-product').innerHTML = '<option value="">Select a product…</option>' + catalogue.map((p) =>
      `<option value="${esc(p.model_name)}">${esc(p.model_name)}${p.price_sar ? ' — ' + money(p.price_sar) : ''}</option>`).join('');
    $('l-product').innerHTML = '<option value="">— Not sure yet —</option>' + catalogue.map((p) =>
      `<option value="${esc(p.model_name)}">${esc(p.model_name)}</option>`).join('');
  }

  // ── basket ─────────────────────────────────────────────────────────────────
  // Percent or fixed-amount discount, capped at the subtotal — same maths the server applies.
  function discountFor(subtotal) {
    if (!promo) return 0;
    let d = promo.discount_type === 'percent' ? subtotal * (promo.discount_value / 100) : promo.discount_value;
    d = Math.round(d * 100) / 100;
    return Math.min(Math.max(0, d), subtotal);
  }

  function renderBasket() {
    const host = $('basket');
    if (!basket.length) { host.innerHTML = '<p class="hint" style="margin-top:12px">No product added yet.</p>'; return; }
    let total = 0;
    host.innerHTML = basket.map((l, i) => {
      const p = catalogue.find((x) => x.model_name === l.model);
      const unit = p && p.price_sar ? Number(p.price_sar) : 0;
      total += unit * l.qty;
      const colour = isDispenser(l.model)
        ? `<select data-color="${i}" aria-label="Colour">${COLORS.map((c) => `<option${c === l.color ? ' selected' : ''}>${c}</option>`).join('')}</select>` : '';
      return `<div class="line">
        <div class="nm">${esc(l.model)}<small>${money(unit)} each</small></div>
        ${colour}
        <div class="qty"><button type="button" data-dec="${i}" aria-label="Less">−</button><span>${l.qty}</span><button type="button" data-inc="${i}" aria-label="More">+</button></div>
        <div class="amt">${money(unit * l.qty)}</div>
        <button class="rm" type="button" data-rm="${i}" aria-label="Remove">✕</button>
      </div>`;
    }).join('');
    const disc = discountFor(total);
    host.innerHTML += disc > 0
      ? `<div class="total" style="font-weight:500;font-size:14px"><span>Subtotal</span><span>${money(total)}</span></div>
         <div class="total" style="font-weight:500;font-size:14px;color:var(--ok);padding-top:4px"><span>Discount (${esc(promo.code)})</span><span>− ${money(disc)}</span></div>
         <div class="total"><span>Total</span><span>${money(total - disc)}</span></div>`
      : `<div class="total"><span>Total</span><span>${money(total)}</span></div>`;
  }

  function promoMsg(text, ok) {
    const el = $('promo-msg'); el.hidden = !text; el.textContent = text || ''; el.style.color = ok ? 'var(--ok)' : 'var(--danger)';
  }

  async function applyPromo() {
    const code = $('f-promo').value.trim();
    if (!code) { promo = null; promoMsg(''); renderBasket(); return; }
    const btn = $('promo-btn'); btn.disabled = true;
    try {
      promo = await api('check-promo', { code });
      $('f-promo').value = promo.code;
      promoMsg('✓ Code applied — ' + (promo.discount_type === 'percent' ? promo.discount_value + '% off' : money(promo.discount_value) + ' off'), true);
    } catch (e) { promo = null; promoMsg(e.message, false); }
    finally { btn.disabled = false; renderBasket(); }
  }

  function addProduct() {
    const name = $('f-product').value;
    if (!name) return;
    const existing = basket.find((l) => l.model === name);
    if (existing) existing.qty = Math.min(20, existing.qty + 1);
    else basket.push({ model: name, qty: 1, color: isDispenser(name) ? 'Black' : null });
    $('f-product').value = '';
    renderBasket();
  }

  $('basket').addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.inc != null) { const l = basket[t.dataset.inc]; l.qty = Math.min(20, l.qty + 1); }
    else if (t.dataset.dec != null) { const l = basket[t.dataset.dec]; l.qty = Math.max(1, l.qty - 1); }
    else if (t.dataset.rm != null) basket.splice(Number(t.dataset.rm), 1);
    else return;
    renderBasket();
  });
  $('basket').addEventListener('change', (e) => {
    if (e.target.dataset.color != null) basket[e.target.dataset.color].color = e.target.value;

  // ── GPS location (same flow as the customer booking page) ────────────────────
  function setLocationBtn(state, labelText, hintText, hintIsError) {
    const btn = $('location-btn');
    btn.classList.remove('got-location', 'error-location');
    if (state === 'got') btn.classList.add('got-location');
    if (state === 'err') btn.classList.add('error-location');
    $('location-btn-label').textContent = labelText;
    const hint = $('location-hint');
    hint.textContent = hintText;
    hint.classList.toggle('error', !!hintIsError);
  }

  async function reverseGeocode(lat, lon) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`, { headers: { 'Accept-Language': 'en' } });
      if (!res.ok) throw new Error('geocode ' + res.status);
      const data = await res.json();
      return data.display_name || null;
    } catch (e) { console.warn('reverse geocode failed:', e); return null; }
  }

  function ensureMap(lat, lon) {
    const el = $('location-map');
    el.classList.add('visible');
    $('map-caption').style.display = 'block';
    if (!leafletMap) {
      leafletMap = L.map(el, { zoomControl: true, attributionControl: true }).setView([lat, lon], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(leafletMap);
      leafletMarker = L.marker([lat, lon], { draggable: true }).addTo(leafletMap);
      leafletMarker.on('dragend', async () => {
        const ll = leafletMarker.getLatLng();
        gpsLat = ll.lat; gpsLon = ll.lng;
        const addr = await reverseGeocode(ll.lat, ll.lng);
        if (addr) $('f-address').value = addr;
      });
      setTimeout(() => leafletMap.invalidateSize(), 100);   // fixes sizing inside an initially-hidden container
    } else {
      leafletMap.setView([lat, lon], 17);
      leafletMarker.setLatLng([lat, lon]);
      setTimeout(() => leafletMap.invalidateSize(), 50);
    }
  }

  function getLocation() {
    if (!navigator.geolocation) { setLocationBtn('err', '❌ GPS not supported', 'This browser does not support location. Please enter the address manually.', true); return; }
    const btn = $('location-btn');
    btn.disabled = true;
    setLocationBtn('', '⏳ Getting location…', 'Please allow location access when prompted.', false);

    navigator.geolocation.getCurrentPosition(async (pos) => {
      gpsLat = pos.coords.latitude; gpsLon = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy);
      const addr = await reverseGeocode(gpsLat, gpsLon);
      if (addr) {
        $('f-address').value = addr;
        setLocationBtn('got', '✓ Location captured', `Accurate to ±${accuracy}m. Drag the pin on the map to refine.`, false);
      } else {
        $('f-address').value = `${gpsLat.toFixed(6)}, ${gpsLon.toFixed(6)}`;
        setLocationBtn('got', '✓ GPS captured (address lookup failed)', 'The street name couldn’t be looked up. Replace the coordinates with the address, or drag the pin.', false);
      }
      ensureMap(gpsLat, gpsLon);
      btn.disabled = false;
    }, (err) => {
      btn.disabled = false;
      let msg;
      if (err.code === 1) msg = 'Location permission was denied. Enter the address manually, or enable location in the browser settings.';
      else if (err.code === 2) msg = 'The device could not determine its location. Please enter the address manually.';
      else if (err.code === 3) msg = 'Location request timed out. Please try again or enter the address manually.';
      else msg = 'Could not get location. Please enter the address manually.';
      setLocationBtn('err', '⚠️ Location unavailable', msg, true);
    }, { enableHighAccuracy: true, timeout: 15_000, maximumAge: 60_000 });
  }

  function resetLocation() {
    gpsLat = null; gpsLon = null;
    $('location-map').classList.remove('visible');
    $('map-caption').style.display = 'none';
    setLocationBtn('', 'Use My Current Location', 'Tap to fill the address from GPS. You can drag the pin on the map to fine-tune.', false);
  }

  // ── submit ─────────────────────────────────────────────────────────────────
  function formError(msg) { const el = $('form-err'); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; if (msg) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  async function submit() {
    if (submitting) return;
    formError('');
    const name = $('f-name').value.trim(), phone = $('f-phone').value.trim(), address = $('f-address').value.trim();
    if (!name) return formError('Enter the customer name.');
    if (!phone) return formError('Enter the customer mobile number.');
    if (!$('f-region').value || !$('f-city').value) return formError('Choose a region and city.');
    if (!address) return formError('Enter the address the customer gave.');
    if (!basket.length) return formError('Add at least one product.');
    if (!selectedSlot) return formError('Pick a date and time slot.');
    if ($('f-promo').value.trim() && !promo) return formError('Press Apply on the promo code, or clear it.');

    submitting = true;
    const btn = $('submit-btn'); btn.disabled = true; btn.textContent = 'Booking…';
    try {
      const res = await api('create-booking', {
        name, phone, address,
        regionId: $('f-region').value, cityName: $('f-city').value,
        floorNo: $('f-floor').value.trim(), flatNo: $('f-flat').value.trim(),
        source: $('f-source').value, slotId: selectedSlot, promoCode: promo ? promo.code : '',
        latitude: gpsLat, longitude: gpsLon, leadId: pendingLeadId || undefined,
        items: basket.map((l) => ({ model: l.model, qty: l.qty, color: l.color }))
      });
      pendingLeadId = null;
      fetchMine(true).catch(() => {});   // refresh in the background so the totals above pick up this booking
      fetchLeads(true).catch(() => {});  // ...and so a converted lead's status/badge picks up too
      showDone(res.booking);
      sendConfirmationSMS(res.booking);
    } catch (e) {
      formError(e.message);
      if (e.status === 409) loadSlots();   // that slot is gone — refresh so it shows struck through
    } finally {
      submitting = false; btn.disabled = false; btn.textContent = 'Confirm booking';
    }
  }

  function showDone(b) {
    $('form-area').hidden = true; $('done-area').hidden = false;
    $('done-ref').textContent = b.reference || '';
    $('done-details').innerHTML =
      `<dt>Customer</dt><dd>${esc(b.customer_name)} · ${esc(b.customer_phone)}</dd>` +
      `<dt>When</dt><dd>${esc(formatDateFull(b.slot_date))}<br>${esc(formatHour(b.slot_hour))}</dd>` +
      `<dt>City</dt><dd>${esc(b.city_name)}</dd>` +
      (b.discount > 0 ? `<dt>Promo</dt><dd>${esc(b.promo_code)} (− ${money(b.discount)})</dd>` : '') +
      `<dt>Total</dt><dd>${money(b.total)}</dd>`;
    window.scrollTo(0, 0);
  }

  function resetForm() {
    ['f-name', 'f-phone', 'f-address', 'f-floor', 'f-flat'].forEach((id) => { $(id).value = ''; });
    $('f-source').selectedIndex = 0;
    basket = []; promo = null; promoMsg(''); $('f-promo').value = ''; selectedSlot = null; formError(''); pendingLeadId = null;
    resetLocation();
    renderBasket(); loadDates();
    $('done-area').hidden = true; $('form-area').hidden = false;

  // Same confirmation text and on/off switch as the office-created bookings.
  // Fire-and-forget: a slow SMS relay must never hold up the salesperson.
  async function sendConfirmationSMS(b) {
    try {
      const { data } = await db.from('sms_settings').select('enabled').eq('key', 'confirmation').maybeSingle();
      if (data && data.enabled === false) return;
      const d = new Date(b.slot_date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const h = Number(b.slot_hour), t = `${h % 12 === 0 ? 12 : h % 12}:00 ${h < 12 ? 'AM' : 'PM'}`;
      const body = `SA'DA H2O - Booking Confirmed!\n\nDear ${b.customer_name},\nRef: ${b.reference}\nDate: ${d}\nTime: ${t}\nCity: ${b.city_name}\n\nOur team will contact you prior to the booking.\n\nThank you for choosing SA'DA H2O!`;
      const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 20000);
      await fetch('/api/send-sms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Secret-Key': 'sada-h2o-relay-2026-secure' },
        body: JSON.stringify({ to: b.customer_phone, body }), signal: ctrl.signal
      });
    } catch (e) { console.warn('SMS failed', e); }
  }

  // ── my bookings (read-only) ────────────────────────────────────────────────
  async function fetchMine(force) {
    if (myBookings && !force) return myBookings;
    myBookings = (await api('my-bookings')).bookings || [];
    renderStats();
    return myBookings;
  }

  async function loadMine(force) {
    $('bk-list').innerHTML = '<div class="empty">Loading…</div>'; $('count').textContent = '';

    catch (e) { $('bk-list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

  // Booking totals for today and this month, in Saudi time (matches every other
  // date boundary in the app) and counted by when the booking was ADDED, not the
  // customer's appointment date — this is a sales-activity count, not a schedule.
  function riyadhDateISO(ts) {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(ts));
    const g = (t) => parts.find((p) => p.type === t).value;
    return `${g('year')}-${g('month')}-${g('day')}`;
  }

  function renderStats() {
    if (!myBookings) return;
    const today = ksaNow().dateISO, month = today.slice(0, 7);
    let day = 0, mon = 0;
    myBookings.forEach((b) => { if (!b.created_at) return; const d = riyadhDateISO(b.created_at); if (d === today) day++; if (d.slice(0, 7) === month) mon++; });
    $('stat-today').textContent = day;
    $('stat-month').textContent = mon;
    // Tab labels get the same day count (bookings added today) and the total
    // list size, so the counts stay in one place instead of drifting apart.
    $('tab-new').textContent = `New Booking (${day})`;
    $('tab-mine').textContent = `My Bookings (${myBookings.length})`;
  }

  function renderMine() {
    const q = $('search').value.trim().toLowerCase();

    $('count').textContent = `${rows.length} booking${rows.length === 1 ? '' : 's'}`;
    if (!rows.length) { $('bk-list').innerHTML = `<div class="empty">${myBookings && myBookings.length ? 'No bookings match your search.' : 'You have not added any bookings yet.'}</div>`; return; }
    $('bk-list').innerHTML = rows.map((b) => {
      const items = (b.booking_items && b.booking_items.length)
        ? b.booking_items.map((i) => `${esc(i.product_model)} × ${i.qty}`).join('<br>')
        : esc(b.product_model || '—');
      const place = [b.location_address, [b.floor_no && 'Floor ' + b.floor_no, b.flat_no && 'Flat ' + b.flat_no].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
      return `<div class="bk">
        <div class="bk-top">
          <div><div class="nm">${esc(b.customer_name)}</div><a href="tel:${esc(b.customer_phone)}">${esc(b.customer_phone)}</a></div>
          <span class="pill" style="background:${getStatusColor(b.status)}">${esc(getStatusLabel(b.status))}</span>
        </div>
        <div class="bk-meta">
          <div><span class="k">Ref</span> ${esc(b.booking_reference)}${b.referral_source ? ' · ' + esc(b.referral_source) : ''}</div>
          <div><span class="k">When</span> ${esc(formatDateFull(b.slot_date))}, ${esc(formatHour(b.slot_hour))}</div>
          <div><span class="k">Where</span> ${esc(b.city_name || '')}${place ? ' — ' + esc(place) : ''}</div>
          <div><span class="k">Products</span><br>${items}</div>
          <div><span class="k">Total</span> ${money(b.order_total - (b.discount_amount || 0))}${b.promo_code ? ` <span class="k">(${esc(b.promo_code)}: − ${money(b.discount_amount)})</span>` : ''}${b.installers && b.installers.name ? ' · <span class="k">Installer</span> ' + esc(b.installers.name) : ''}</div>

  async function submitLead() {
    leadError('');
    const name = $('l-name').value.trim(), phone = $('l-phone').value.trim();
    if (!name) return leadError('Enter the lead’s name.');
    if (!phone) return leadError('Enter a mobile number.');

    try {
      await api('create-lead', {
        name, phone, regionId: $('l-region').value, cityName: $('l-city').value,
        productInterest: $('l-product').value, source: $('l-source').value, notes: $('l-notes').value.trim()
      });

  // "Convert to Booking" pre-fills the New Booking form from the lead and
  // remembers its id — submit() below sends it along so the server can mark
  // the lead converted once the booking is actually confirmed. Nothing about
  // the lead changes until that booking succeeds.
  function convertLead(id) {
    const l = (leads || []).find((x) => x.id === id);
    if (!l) return;
    resetForm();
    pendingLeadId = id;
    $('f-name').value = l.name;
    $('f-phone').value = l.phone.replace(/^\+966/, '0');
    if (l.region_id && regionsCache.some((r) => r.id === l.region_id)) {
      $('f-region').value = l.region_id;
      onRegionChange().then(() => { if (l.city_name) $('f-city').value = l.city_name; });
    }
    if (l.source) $('f-source').value = l.source;
    if (l.product_interest) { $('f-product').value = l.product_interest; addProduct(); }
    showTab('new');
    toast(`Converting lead: ${l.name} — fill in the address and slot, then confirm`);
  }

  async function markLeadLost(id) {
    const l = (leads || []).find((x) => x.id === id);
    if (!l) return;
    const reason = prompt(`Mark ${l.name} as lost. Reason (optional):`);
    if (reason === null) return;
    try {
      await api('mark-lead-lost', { leadId: id, reason: reason.trim() || undefined });
      toast('Lead marked lost');
      await fetchLeads(true);
      renderLeads();
    } catch (e) { toast(e.message); }
  }

  // ── boot ───────────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => showTab(t.dataset.tab)));
  $('f-region').addEventListener('change', onRegionChange);
  $('f-date').addEventListener('change', loadSlots);
  $('add-product').addEventListener('click', addProduct);
  $('location-btn').addEventListener('click', getLocation);
  $('promo-btn').addEventListener('click', applyPromo);
  $('f-promo').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyPromo(); } });
  // Editing the code after applying it un-applies it, so a stale discount can't ride along.
  $('f-promo').addEventListener('input', () => { if (promo && $('f-promo').value.trim().toLowerCase() !== promo.code.toLowerCase()) { promo = null; promoMsg(''); renderBasket(); } });
  $('submit-btn').addEventListener('click', submit);
  $('another-btn').addEventListener('click', resetForm);
  $('view-mine-btn').addEventListener('click', () => { resetForm(); showTab('mine'); });
  $('search').addEventListener('input', () => { if (myBookings) renderMine(); });
  $('refresh-btn').addEventListener('click', () => loadMine(true));
  $('signout-btn').addEventListener('click', async () => { await db.auth.signOut(); window.location.href = '../admin/login.html'; });
  $('f-source').innerHTML = '<option value="">— Select —</option>' + SOURCES.map((s) => `<option>${esc(s)}</option>`).join('');
  $('l-source').innerHTML = '<option value="">— Not sure yet —</option>' + SOURCES.map((s) => `<option>${esc(s)}</option>`).join('');
  $('l-region').addEventListener('change', onLeadRegionChange);
  $('lead-submit-btn').addEventListener('click', submitLead);

  (async function init() {
    const me = await guard();
    if (!me) return;
    $('who-name').textContent = me.name;
    renderBasket();
    await Promise.all([loadCatalogue(), loadRegions(), fetchMine(), fetchLeads()]);
  })();
</script>
</body>
</html>
